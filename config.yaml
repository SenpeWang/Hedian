# 核电站监护制合规检测系统 — 全局配置
# 本文件是唯一配置事实源；core/config_manager.py 加载本文件

app:
  # 视角级 GPU 分配: front(tracker+gaze+identity)=0, voice/pop/evaluation=1
  gpu_map:
    tracker: "0"
    identity: "0"
    voice: "1"
    behavior: "1"
    evaluation: "1"
  gpu_default: "0"
  fps: 30.0
  port: 5002

redis:
  host: "localhost"
  port: 6379
  db: 0

paths:
  data_root: "data"
  model_root: "models"
  result_root: "data/results"

videos:
  front: "data/videos/camFRONT.mpg"
  pop: "data/videos/camPOP.mpg"

# 场景(机室)配置 —— 换机室只改这里，不再改代码
#   room_id: 1=机室1, 2=机室2（决定用 workstations.json 里哪一套工位、哪一份 ROI）
#   workstations: 工位基准点(anchor) + 判定多边形(polygon) 定义文件
#   roi: 屏幕关注区；留空则依次回退 data/ROI_room{id}.json -> data/ROI.json
scene:
  room_id: 1
  workstations: "data/workstations.json"
  roi: ""

supervision:
  bind_hold_sec: 10.0
  unbind_hold_sec: 10.0
  dist_close_px: 200
  dist_near_px: 560
  consec_raise: 3
  consec_idle: 3
  cooldown_sec: 1.5
  hand_frame_step: 3  # 举手检测姿态推理跳帧(每3帧1次+EMA复用)

tracker:
  detection:
    conf_threshold: 0.65
    pose_confidence: 0.35
    nms_threshold: 0.35
    img_size: 640
    weights: "best_nuclear.pt"         # 人员检测主模型(核电站自训 best.pt, 单类 person)
    # 姿态估计(举手检测与 MOT 姿态)：本机 ultralytics 8.3.191 不认 yolo26 系列
    # (缺 Pose26 类)，故用兼容权重 pose.pt；升级 ultralytics 后可切回 yolo26s-pose.pt
    pose_model: "pose.pt"

voice:
  sample_rate: 16000
  # 句边界停顿阈值（秒）。须 ≥ vad_min_silence_sec(0.8)，否则"句边界比段边界
  # 更敏感"，会造成大量段内无意义断句，导致岗位词被切开
  sentence_gap_sec: 1.0
  # ASR 权重(微调版 v570e)
  model_path: "/home/yehaomin/asr/models/Qwen3-ASR-0.6B-finetuned-v570e"
  aligner_path: "models/voice/qwen/Qwen3-ForcedAligner-0.6B"
  torch_dtype: "bfloat16"
  # VAD 分段参数（对齐 run_infer.py 评估链路）
  vad_noise_db: -35.0
  vad_min_silence_sec: 0.8
  vad_speech_pad_sec: 0.2
  vad_min_speech_sec: 0.35
  vad_max_chunk_sec: 30.0

  # ── 流式解码 ────────────────────────────────────────────────────
  # 管道单次读取块时长（秒）：越小首包延迟越低
  stream_block_sec: 0.2
  # 切片策略：silence_vad（在线 VAD，默认）| fixed_window（固定窗 + 重叠窗）
  segmenter: "silence_vad"
  # 段间左上下文重叠（秒）：给模型段首上下文，降低边界丢字与凭空补词（幻觉）；
  # 重叠区被解码两次，重复词由全局词流按时间戳去重。
  # 取值 0.4s：实测更大取值收益不明显，且关键词命中率下降
  boundary_overlap_sec: 0.4
  # 长语音强制切分时回看窗口（秒）：在窗口内挑能量最低点切分（词边界保护，
  # 避免 "收到" 被硬切成 "收" / "到"）
  vad_split_search_sec: 1.0
  # 强制切分时"接近最低能量"的容差（dB）：越大越偏向切点靠近 max_chunk 位置
  vad_split_margin_db: 6.0
  # 跨段句子组装上限（秒）：超长强制封句，防止单句无限累积
  max_sentence_sec: 30.0
  # 保护词（不可被句边界切开，如 一回路/二回路/机组长/请讲/请监护/收到 等）
  #   null        = 自动取 KEYWORD_LABELS 中长度 ≥2 的关键词（推荐）
  #   []          = 关闭保护
  #   [一回路, 二回路] = 自定义词表（覆盖自动派生）
  protected_words: null
  # 句尾是保护词未完成前缀（如 "二"、"请"）时，最多额外挂起该秒数等待后续，
  # 超时后按普通规则封句，避免上屏被无限延迟（总挂起上限 ≈ 句阈值 + 该值）
  protected_hold_sec: 2.0
  # fixed_window 策略参数（仅 segmenter=fixed_window 时生效）
  fixed_window_sec: 20.0
  fixed_window_overlap_sec: 5.0

gaze:
  head_conf_th: 0.55
  inout_th: 0.5
  heatmap_th: 0.3
  head_min_size: 20
  head_max_size: 300
  head_model: "yolov8n_head.onnx"                                            # 头部检测
  gaze_model: "gazelle_dinov3_vits16plus_finetuned_1x3x640x640_1xNx4.onnx"  # 视线估计

# 合规评估: 大模型对完整流程多模态证据链打分
evaluation:
  model_path: "models/evaluation/Qwen3-8B"  # 评估主模型

# 行为检测: YOLO 四分类(hand/file/person/pointing_hand) + MediaPipe 21 关键点指向手势
# detection 为共享的检测与手势判定参数; finger_screen / finger_file 为各自的目标归属与去重参数
behavior:
  detection:
    weights: "models/behavior/detect_4class.pt"  # 四分类主模型
    pose_model: "models/behavior/pose.pt"  # 角色判别用姿态模型(yolo11l-pose, 双人场景更稳)
    union_weights: "models/behavior/detect_3class_union.pt"  # 并集模型(补手框召回); 置空串则不用
    device: "0"  # YOLO 推理设备(子进程已按 gpu_map 限定可见 GPU)
    confidence: 0.25  # YOLO 置信度
    frame_step: 8  # 跳帧: 每 8 帧推理 1 次, 其余复用上次结果
    pad_ratio: 0.8  # 手框外扩比例(补回手腕/前臂)
    target_size: 480  # 裁剪后长边目标像素, 不足则放大
    max_num_hands: 2  # 每个手框内最多认几只手
    mp_detection_confidence: 0.3  # MediaPipe 手部检测置信度
    straight_angle: 165.0  # 食/中指 >= 该角度算伸直
    straight_angle_relaxed: 130.0  # 相对条件: 允许的最小角度
    point_gap: 35.0  # 相对条件: 指向指需比弯曲指高出的角度
    flex_angle: 160.0  # 无名/小指 < 该角度算弯曲
    point_thumb_gap: 0.60  # 指向指尖到拇指尖距离/掌宽下限(排除捏握)
    try_mirrored_order: true  # MediaPipe 指序标反时按镜像指序再判一次
    four_class_confidence_hi: 0.5  # 四分类 pointing_hand 置信度 >= 该值: 直接采信
    four_class_confidence_lo: 0.25  # 置信度在 [lo, hi): 需 MediaPipe 规则复核
    other_hand_iou: 0.2  # 与目标框 IoU >= 该值的框视为同一只手, 不做遮罩
    union_iou: 0.5  # 并集模型框与已有框 IoU >= 该值视为同一只, 不重复添加
    draw_all_hands: true  # 是否绘制所有手的关键点(否则只画指向手)
  finger_screen:
    screen_overlap_threshold: 0.2  # 手框与机箱重叠比 > 该值 -> 手指屏幕
    max_dist: 10  # 手框到机箱距离 < 该值 -> 手指屏幕
    cooldown_sec: 1.5  # 触发冷却(上升沿之外的兜底)
    debounce_frames: 3  # 连续 N 帧无指向才算动作结束
  finger_file:
    file_contain_threshold: 0.7  # 手框被 file 框包含比 >= 该值 -> 指向文件
    merge_sec: 5.0  # 同角色间隔 <= 该值算同一次指向
    role_cooldown_sec: 1.5  # 角色抖动冷却
    grace_frames: 12  # 遮挡空窗填补帧数

# 人员身份与在岗监控（独立进程；阶段 1 = 检测+跟踪+工位在岗判定）
#   away_hold_sec: 连续离开工位多边形超过该秒数才确认"离岗"
#   push_interval_sec: 前端面板推送节流
#   detection: 留空则沿用 tracker.detection
identity:
  # true = 内嵌到 tracker 进程复用其 tracks（省一份 YOLO，main.py 不再起独立进程）
  # false = 独立进程（自带检测+跟踪），适合单独调试
  embedded: true
  away_hold_sec: 2.0
  push_interval_sec: 0.5
  detection:
    weights: "best_nuclear.pt"   # 与 tracker 共用自训权重(单类 person)
  # 人脸识别：InsightFace 三模板身份锁定
  face:
    enabled: true
    model_name: "buffalo_l"
    det_size: 640
    ctx_id: 0                    # 子进程已按 gpu_map 限定可见 GPU，这里固定 0
    min_box_size: 40             # 人体框最小边长，太小不裁人脸
    det_score: 0.7               # 人脸检测得分门槛
    verify_interval_sec: 0.5     # 同一 tid 的人脸推理节流间隔
  # 身份锁定状态机
  lock:
    spatial_threshold: 1.2       # 人脸距离 < 该值判为匹配
    margin: 0.10                 # 与次优角色的最小距离差
    grace_sec: 2.5               # 驻留确认允许的中断间隔(容忍 ID 抖动)
    strong_time_sec: 1.5         # 强匹配所需驻留时长
    strong_passes: 2             # 强匹配所需合格次数
    weak_time_sec: 5.0           # 弱匹配所需驻留时长
    weak_passes: 4               # 弱匹配所需合格次数
    absent_hold_sec: 3.0         # 锁定后连续不在画面多久释放
    elim_frames: 5               # 排除法补位所需连续帧
    auto_register_frames: 15     # 自动注册底库所需连续在岗帧

modules:
  gaze: true
  voice: true
  tracker: true
  identity: true         # 内嵌到 tracker 进程复用 tracks（identity.embedded=true）
  personnel_status: true
  info_notice: true
  behavior: true
  evaluation: true

rules:
  supervision: true
  self_ticket: true
  personnel_status: true
  # 制度阈值（落盘在配置里，改值即生效，无需改代码）
  # 口径沿用人员状态监控规程：视线离开盘台 1 分钟、无人值守 10 秒
  params:
    personnel_status:
      gaze_away_sec: 60.0     # 两名操纵员视线同时离开盘台持续该秒数 → 违规
      no_people_sec: 10.0     # 主控室人员少于 1 人持续该秒数 → 违规
      # 工位离岗不在此设阈值：口径沿用 identity.away_hold_sec（连续离开工位
      # 多边形超过该秒数即确认离岗），确认离岗即记 STATION_AWAY_VIOLATION
  info_notice: true
  normal_comm: true
