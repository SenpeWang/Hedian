# 核电站监护制合规检测系统 — 全局配置
# 此文件覆盖 config.py 中的默认值

app:
  gpu: "0"
  fps: 30.0
  port: 5002

redis:
  host: "localhost"
  port: 6379
  db: 0

paths:
  data_root: "data"
  model_root: "models"
  result_root: "data/results"

videos:
  front: "data/videos/camFRONT.mpg"
  pop: "data/videos/camPOP.mpg"

supervision:
  bind_hold_sec: 10.0
  unbind_hold_sec: 10.0
  dist_close_px: 200
  dist_near_px: 560
  consec_raise: 3
  consec_idle: 3
  cooldown_sec: 1.5

tracker:
  detection:
    conf_threshold: 0.65
    pose_confidence: 0.35
    nms_threshold: 0.35
    img_size: 640

bus:
  max_queue_size: 1024

voice:
  sample_rate: 16000
  sentence_gap_sec: 0.6
  asr_engine: "qwen3"
  model_path: "models/voice/qwen/Qwen3-ASR-0.6B"
  aligner_path: "models/voice/qwen/Qwen3-ForcedAligner-0.6B"
  torch_dtype: "bfloat16"

gaze:
  head_conf_th: 0.55
  inout_th: 0.5
  heatmap_th: 0.3
  head_min_size: 20
  head_max_size: 300

behavior:
  finger_screen:
    detect_conf: 0.25
    screen_overlap_threshold: 0.2
    max_dist: 10
    cooldown_sec: 1.5
  finger_file:
    detect_conf: 0.25
    file_iou_threshold: 0.2
    cooldown_sec: 1.5

modules:
  gaze: true
  voice: true
  tracker: true
  personnel_status: true
  info_notice: true
  behavior: true

rules:
  supervision: true
  self_ticket: true
  personnel_status: true
  info_notice: true
