# 核电站监护制合规检测系统 — 全局配置
# 此文件覆盖 config.py 中的默认值

app:
  # 视角级 GPU 分配: front(tracker+gaze)=0, voice/pop/evaluation=1
  gpu_map:
    tracker: "0"
    voice: "1"
    behavior: "1"
    evaluation: "1"
  gpu_default: "0"
  fps: 30.0
  port: 5002

redis:
  host: "localhost"
  port: 6379
  db: 0

paths:
  data_root: "data"
  model_root: "models"
  result_root: "data/results"

videos:
  front: "data/videos/camFRONT.mpg"
  pop: "data/videos/camPOP.mpg"

supervision:
  bind_hold_sec: 10.0
  unbind_hold_sec: 10.0
  dist_close_px: 200
  dist_near_px: 560
  consec_raise: 3
  consec_idle: 3
  cooldown_sec: 1.5
  hand_frame_step: 3  # 举手检测姿态推理跳帧(每3帧1次+EMA复用)

tracker:
  detection:
    conf_threshold: 0.65
    pose_confidence: 0.35
    nms_threshold: 0.35
    img_size: 640

bus:
  max_queue_size: 1024

voice:
  sample_rate: 16000
  # 句边界停顿阈值（秒）。须 ≥ vad_min_silence_sec(0.8)，否则"句边界比段边界
  # 更敏感"，会造成大量段内无意义断句，导致岗位词被切开
  sentence_gap_sec: 1.0
  asr_engine: "qwen3"
  # 微调 ASR 权重（v570e，1.5GB）；如需换回基础版权重，改成 models/voice/qwen/Qwen3-ASR-0.6B
  model_path: "/home/yehaomin/asr/models/Qwen3-ASR-0.6B-finetuned-v570e"
  aligner_path: "models/voice/qwen/Qwen3-ForcedAligner-0.6B"
  torch_dtype: "bfloat16"
  # VAD 分段参数（对齐 run_infer.py 评估链路）
  vad_noise_db: -35.0
  vad_min_silence_sec: 0.8
  vad_speech_pad_sec: 0.2
  vad_min_speech_sec: 0.35
  vad_max_chunk_sec: 30.0

  # ── 流式解码 ────────────────────────────────────────────────────
  # 管道单次读取块时长（秒）：越小首包延迟越低
  stream_block_sec: 0.2
  # 切片策略：silence_vad（在线 VAD，默认）| fixed_window（固定窗 + 重叠窗）
  segmenter: "silence_vad"
  # 段间左上下文重叠（秒）：给模型段首上下文，降低边界丢字与凭空补词（幻觉）；
  # 重叠区被解码两次，重复词由全局词流按时间戳去重。
  # 取值 0.4s：实测更大取值收益不明显，且关键词命中率下降
  boundary_overlap_sec: 0.4
  # 长语音强制切分时回看窗口（秒）：在窗口内挑能量最低点切分（词边界保护，
  # 避免 "收到" 被硬切成 "收" / "到"）
  vad_split_search_sec: 1.0
  # 强制切分时"接近最低能量"的容差（dB）：越大越偏向切点靠近 max_chunk 位置
  vad_split_margin_db: 6.0
  # 跨段句子组装上限（秒）：超长强制封句，防止单句无限累积
  max_sentence_sec: 30.0
  # 保护词（不可被句边界切开，如 一回路/二回路/机组长/请讲/请监护/收到 等）
  #   null        = 自动取 KEYWORD_LABELS 中长度 ≥2 的关键词（推荐）
  #   []          = 关闭保护
  #   [一回路, 二回路] = 自定义词表（覆盖自动派生）
  protected_words: null
  # 句尾是保护词未完成前缀（如 "二"、"请"）时，最多额外挂起该秒数等待后续，
  # 超时后按普通规则封句，避免上屏被无限延迟（总挂起上限 ≈ 句阈值 + 该值）
  protected_hold_sec: 2.0
  # fixed_window 策略参数（仅 segmenter=fixed_window 时生效）
  fixed_window_sec: 20.0
  fixed_window_overlap_sec: 5.0

gaze:
  head_conf_th: 0.55
  inout_th: 0.5
  heatmap_th: 0.3
  head_min_size: 20
  head_max_size: 300

# 行为检测: YOLO 四分类(hand/file/person/pointing_hand) + MediaPipe 21 关键点指向手势
# detection 为共享的检测与手势判定参数; finger_screen / finger_file 为各自的目标归属与去重参数
behavior:
  detection:
    weights: "models/behavior/detect_4class.pt"  # 四分类主模型
    pose_model: "models/behavior/pose.pt"  # 角色判别用姿态模型(yolo11l-pose, 双人场景更稳)
    union_weights: "models/behavior/detect_3class_union.pt"  # 并集模型(补手框召回); 置空串则不用
    device: "0"  # YOLO 推理设备(子进程已按 gpu_map 限定可见 GPU)
    confidence: 0.25  # YOLO 置信度
    frame_step: 8  # 跳帧: 每 8 帧推理 1 次, 其余复用上次结果
    pad_ratio: 0.8  # 手框外扩比例(补回手腕/前臂)
    target_size: 480  # 裁剪后长边目标像素, 不足则放大
    max_num_hands: 2  # 每个手框内最多认几只手
    mp_detection_confidence: 0.3  # MediaPipe 手部检测置信度
    straight_angle: 165.0  # 食/中指 >= 该角度算伸直
    straight_angle_relaxed: 130.0  # 相对条件: 允许的最小角度
    point_gap: 35.0  # 相对条件: 指向指需比弯曲指高出的角度
    flex_angle: 160.0  # 无名/小指 < 该角度算弯曲
    point_thumb_gap: 0.60  # 指向指尖到拇指尖距离/掌宽下限(排除捏握)
    try_mirrored_order: true  # MediaPipe 指序标反时按镜像指序再判一次
    four_class_confidence_hi: 0.5  # 四分类 pointing_hand 置信度 >= 该值: 直接采信
    four_class_confidence_lo: 0.25  # 置信度在 [lo, hi): 需 MediaPipe 规则复核
    other_hand_iou: 0.2  # 与目标框 IoU >= 该值的框视为同一只手, 不做遮罩
    union_iou: 0.5  # 并集模型框与已有框 IoU >= 该值视为同一只, 不重复添加
    draw_all_hands: true  # 是否绘制所有手的关键点(否则只画指向手)
  finger_screen:
    screen_overlap_threshold: 0.2  # 手框与机箱重叠比 > 该值 -> 手指屏幕
    max_dist: 10  # 手框到机箱距离 < 该值 -> 手指屏幕
    cooldown_sec: 1.5  # 触发冷却(上升沿之外的兜底)
    debounce_frames: 3  # 连续 N 帧无指向才算动作结束
  finger_file:
    file_contain_threshold: 0.7  # 手框被 file 框包含比 >= 该值 -> 指向文件
    merge_sec: 5.0  # 同角色间隔 <= 该值算同一次指向
    role_cooldown_sec: 1.5  # 角色抖动冷却
    grace_frames: 12  # 遮挡空窗填补帧数

modules:
  gaze: true
  voice: true
  tracker: true
  personnel_status: true
  info_notice: true
  behavior: true
  evaluation: true

rules:
  supervision: true
  self_ticket: true
  personnel_status: true
  info_notice: true
  normal_comm: true
