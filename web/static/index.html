<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核电站行为合规检测系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0e1a; color: #e0e6f0; overflow: hidden; height: 100vh; display: flex; flex-direction: column }
    ::-webkit-scrollbar { width: 4px }
    ::-webkit-scrollbar-track { background: #0a0e1a }
    ::-webkit-scrollbar-thumb { background: #1e2a42; border-radius: 2px }

    .header { display: flex; align-items: center; padding: 5px 14px; background: linear-gradient(135deg, #0d1224, #141b2d); border-bottom: 1px solid #1e2a42; justify-content: space-between; min-height: 36px }
    .header h1 { font-size: 15px; color: #00d4ff; white-space: nowrap }
    #startBtn { padding: 5px 20px; border: 1px solid #00d4ff; border-radius: 5px; background: linear-gradient(135deg, rgba(0, 212, 255, .1), rgba(0, 100, 200, .15)); color: #00d4ff; cursor: pointer; font-size: 13px; font-weight: 600; transition: .3s }
    #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 10px rgba(0, 212, 255, .3) }
    #startBtn:disabled { opacity: .5; cursor: default; transform: none }
    .header-right { display: flex; align-items: center; gap: 8px }
    #statusDot { width: 7px; height: 7px; border-radius: 50%; background: #6b7a90; flex-shrink: 0 }
    #statusDot.active { background: #00ff88; animation: pulse 1.5s infinite }
    #headerStatus { font-size: 11px; color: #e0e6f0; white-space: nowrap; max-width: 350px; overflow: hidden; text-overflow: ellipsis }
    .progress-group { display: flex; flex-direction: column; gap: 1px; min-width: 260px }
    .progress-row { font-family: 'Consolas', monospace; font-size: 10px; color: #8899aa; white-space: nowrap; line-height: 1.2 }

    /* 上部：三列视频（占2/3高度） */
    .main { display: flex; flex: 2; min-height: 0; gap: 5px; padding: 5px 5px 0 }
    .video-col { display: flex; flex-direction: column; min-width: 0; flex: 1 }
    .video-col.tracker { flex: 1.2 }

    .panel { background: #141b2d; border: 1px solid #1e2a42; border-radius: 5px; display: flex; flex-direction: column; overflow: hidden }
    .panel-title { font-size: 11px; font-weight: 600; padding: 5px 8px; border-bottom: 1px solid #1e2a42; color: #8899aa; display: flex; align-items: center; justify-content: space-between }
    .panel-body { flex: 1; overflow-y: auto; padding: 5px; position: relative }

    #streamImg, #streamImg2, #streamImg3 { width: 100%; height: 100%; object-fit: contain; display: block }

    .video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7a90; gap: 6px }
    .video-placeholder .icon { font-size: 28px }
    .video-placeholder .text { font-size: 12px }

    .text-item { padding: 2px 4px; margin-bottom: 2px; border-radius: 2px; font-size: 11px; line-height: 1.4; animation: fadeIn .3s }
    .text-item .ts { color: #6b7a90; margin-right: 4px; font-size: 9px }
    .kw-red { color: #ff4d4d; font-weight: 700 }
    .kw-green { color: #00ff88; font-weight: 700 }
    .kw-blue { color: #00d4ff; font-weight: 700 }

    /* 下部：对话(左) + 通知(中) + 报告(右)（占1/3高度） */
    .bottom { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 5px; padding: 5px; flex: 1; min-height: 0 }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 3px; margin-bottom: 5px; text-align: center }
    .summary-grid div { background: #0a0e1a; border-radius: 3px; padding: 3px }
    .summary-grid .val { font-size: 16px; font-weight: 700; color: #00d4ff }
    .summary-grid .lbl { font-size: 8px; color: #6b7a90; margin-top: 1px }

    .seg-card { background: #0a0e1a; border-radius: 3px; padding: 4px 6px; margin-bottom: 3px; border-left: 3px solid #6b7a90; animation: fadeIn .3s }
    .seg-card .sc-head { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 2px; cursor: pointer; user-select: none }
    .seg-card .sc-head:hover { opacity: 0.8 }
    .seg-card .sc-score { font-weight: 700 }
    .seg-card .sc-bar { height: 2px; background: #1e2a42; border-radius: 1px; margin: 2px 0 }
    .seg-card .sc-bar-fill { height: 100%; border-radius: 1px; transition: width .6s }
    .seg-card .sc-detail { font-size: 9px; color: #8899aa; line-height: 1.3 }
    .seg-card.collapsed .sc-bar, .seg-card.collapsed .sc-detail { display: none !important }
    .sc-toggle-icon { font-size: 8px; color: #8899aa; margin-left: 6px; display: inline-block; vertical-align: middle }

    think { display: block; background: #f8fafc; border-left: 4px solid #cbd5e1; padding: 12px 16px; margin: 12px 0; color: #475569; font-size: 13px; line-height: 1.6; border-radius: 4px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; white-space: pre-wrap }
    think::before { content: "🤔 思考过程："; display: block; font-weight: 600; color: #64748b; margin-bottom: 6px; font-size: 12px }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }

    .status-stats { flex: none; background: rgba(10, 14, 26, 0.65); border-bottom: 1px solid #1e2a42; padding: 6px 10px; display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(8px) }
    .status-stats .stat-item { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: #e0e6f0 }
    .status-stats .stat-label { color: #8899aa; margin-right: 6px }
    .status-stats .stat-val { font-size: 18px; font-weight: 700; color: #00ff88; margin-right: 2px }
    .status-stats .stat-alert { font-size: 9px; color: #8899aa; margin-top: 1px; font-weight: normal }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px }
    .stat-block { background: #0a0e1a; border: 1px solid #1e2a42; border-radius: 4px; padding: 5px 8px; display: flex; flex-direction: column; gap: 2px }
    .stat-block-label { font-size: 10px; color: #6b7a90; font-weight: 600 }
    .stat-block-content { display: flex; align-items: baseline; gap: 2px }
    .stat-unit { font-size: 12px; color: #8899aa; font-weight: 600 }

    .flow-events { flex: 1; overflow-y: auto; padding: 4px 6px; border-top: 1px solid #1e2a42; margin-top: 4px; min-height: 0 }
    .flow-events:empty { display: none }
    .flow-event { font-size: 11px; padding: 5px 8px; border-left: 3px solid #00d4ff; margin-bottom: 4px; background: #0a0e1a; border-radius: 3px; color: #e0e6f0; animation: fadeIn .3s }
    .flow-event .ts { color: #6b7a90; margin-right: 6px; font-family: 'JetBrains Mono', monospace }

    .gaze-progress-wrap { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 10px }
    .gaze-progress-track { flex: 1; height: 3px; background: #1e2a42; border-radius: 2px; overflow: hidden }
    .gaze-progress-bar { height: 100%; width: 0%; background: #ffaa00; border-radius: 2px; transition: width .3s, background .3s }
    .gaze-progress-text { color: #8899aa; font-weight: 600; min-width: 50px; text-align: right }
  </style>
</head>

<body>
  <div class="header">
    <h1><span>⚛️</span>核电站行为合规检测系统</h1>
    <button id="startBtn" onclick="startPipeline()">👤 开始测试</button>
    <div class="header-right">
      <div id="statusDot"></div>
      <span id="headerStatus">就绪</span>
      <div class="progress-group" id="progressGroup" style="display:none">
        <div class="progress-row" id="prVoice">🎤 |░░░░░░░░░░░░░░░░░░░░| 0%</div>
        <div class="progress-row" id="prMot">🎯 |░░░░░░░░░░░░░░░░░░░░| 0%</div>
        <div class="progress-row" id="prGaze">👁️ |░░░░░░░░░░░░░░░░░░░░| 0%</div>
      </div>
    </div>
  </div>

  <!-- 上部：三列视频 -->
  <div class="main">
    <!-- 左：目标跟踪 -->
    <div class="video-col tracker">
      <div class="panel" style="flex:1">
        <div class="panel-title">🎥 目标跟踪</div>
        <div class="panel-body" style="padding:0;flex:1;position:relative">
          <img id="streamImg" alt="">
          <div class="video-placeholder" id="overlay1">
            <div class="icon">🎥</div>
            <div class="text">等待视频输入</div>
          </div>
        </div>
      </div>
    </div>
    <!-- 中：行为检测(屏幕视角) -->
    <div class="video-col">
      <div class="panel" style="flex:1">
        <div class="panel-title">🔍 行为检测(屏幕视角)</div>
        <div class="panel-body" style="padding:0;flex:1;position:relative">
          <img id="streamImg2" alt="">
          <div class="video-placeholder" id="overlay2">
            <div class="icon">🎥</div>
            <div class="text">等待视频输入</div>
          </div>
        </div>
      </div>
    </div>
    <!-- 右：行为检测(文件视角) -->
    <div class="video-col">
      <div class="panel" style="flex:1">
        <div class="panel-title">🔍 行为检测(文件视角)</div>
        <div class="panel-body" style="padding:0;flex:1;position:relative">
          <img id="streamImg3" alt="">
          <div class="video-placeholder" id="overlay3">
            <div class="icon">🎥</div>
            <div class="text">等待视频输入</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 下部：对话(左) + 通知(中) + 报告(右) -->
  <div class="bottom">
    <!-- 左下：对话记录（压缩） -->
    <div class="panel">
      <div class="panel-title">🎤 人员对话记录</div>
      <div class="panel-body" id="textScroll"></div>
    </div>
    <!-- 中下：系统通知 -->
    <div class="panel">
      <div class="panel-title">📊 系统通知</div>
      <div class="status-stats" id="statusStats">
        <div class="stat-grid">
          <div class="stat-block">
            <div class="stat-block-label">👥 监控室人数</div>
            <div class="stat-block-content">
              <span class="stat-val" id="peopleCountVal">--</span>
              <span class="stat-unit">人</span>
            </div>
            <div class="stat-alert" id="peopleStatusAlert">就绪</div>
          </div>
          <div class="stat-block">
            <div class="stat-block-label">👁️ 凝视状态</div>
            <div class="stat-block-content">
              <span class="stat-val" id="gazeStatusNum" style="color:#6b7a90">待检测</span><span class="stat-unit" id="gazeStatusUnit" style="display:none"></span>
            </div>
            <div class="gaze-progress-wrap" id="gazeProgressWrap" style="display:none">
              <div class="gaze-progress-track">
                <div class="gaze-progress-bar" id="gazeProgressBar"></div>
              </div>
              <span class="gaze-progress-text" id="gazeProgressText">0/60S</span>
            </div>
          </div>
        </div>
      </div>
      <div class="flow-events" id="flowEventsBody"></div>
    </div>
    <!-- 右下：评价报告 -->
    <div class="panel">
      <div class="panel-title">📋 评价报告</div>
      <div class="panel-body">
        <div class="summary-grid">
          <div><div class="val" id="msSup">0</div><div class="lbl">监护制流程</div></div>
          <div><div class="val" id="msTicket">0</div><div class="lbl">自唱票流程</div></div>
          <div><div class="val" id="msNotice">0</div><div class="lbl">信息通报</div></div>
          <div><div class="val" id="msAvg">-</div><div class="lbl">平均分</div></div>
          <div><div class="val" id="msTotal">-</div><div class="lbl">总分</div></div>
        </div>
        <div id="segCards"></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="none" style="display:none"></audio>

  <script>
    const $ = id => document.getElementById(id);
    let dataSource = null, segScores = [], supN = 0, ticketN = 0, noticeN = 0, _completedFlows = new Set(), hasVisualizedFirstFrame = false, maxPlayedAudioSec = 0.0;
    let _voiceText = {}, _voiceKeys = {}, lastClockSec = -1;
    const audio = $('audioPlayer');
    audio.onerror = function () { audio.removeAttribute('src'); audio.load(); };
        // ==========================================
    // 窗口化音视频对齐控制器 (Window Alignment Controller)
    // 设定 ±400ms 对齐窗口，确保音频与推理可视化结果在同一窗口内严格同步
    // ==========================================
    const ALIGN_WINDOW_SEC = 0.4;

    function syncAudioWindow(targetSec) {
      if (!audio || !hasVisualizedFirstFrame) return;

      const drift = audio.currentTime - targetSec; // drift > 0: 声音快于画面; drift < 0: 声音慢于画面

      // 情况 1: 声音快于画面超过 0.3s -> 立刻暂停声音，原地等待后端可视化画面追赶上来
      if (drift > 0.3) {
        if (!audio.paused) {
          audio.pause();
        }
        return;
      }

      // 情况 2: 声音落后画面超过 1.0s -> 声音向前跳跃追赶画面 (绝对不向后倒退 Seek)
      if (drift < -1.0) {
        audio.currentTime = targetSec;
        audio.playbackRate = 1.0;
        if (audio.paused) {
          audio.play().catch(function () { });
        }
        return;
      }

      // 情况 3: 声音与画面保持在 [-1.0s, +0.3s] 的完美对齐区间 -> 恢复正常播放
      audio.playbackRate = 1.0;
      if (audio.paused && targetSec > 0.1) {
        if (!audio.src || audio.src === location.href || audio.src.endsWith('/')) {
          audio.src = '/audio?t=' + Date.now(); audio.load(); audio.currentTime = targetSec;
        }
        audio.play().catch(function () { });
      }
    }

    function fmt(s) { let m = Math.floor(s / 60), ss = Math.floor(s % 60); return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` }

    function startPipeline() {
      const btn = $('startBtn'); btn.disabled = true; btn.textContent = '⏳ 推理中...';
      $('statusDot').className = 'active'; $('headerStatus').textContent = '🚀 启动中…';
      $('progressGroup').style.display = '';
      segScores = []; supN = 0; ticketN = 0; noticeN = 0;
      _completedFlows.clear();
      _streamBuffers = {};
      hasVisualizedFirstFrame = false;
      $('overlay1').style.display = ''; $('overlay2').style.display = ''; $('overlay3').style.display = '';
      _voiceText = {}; _voiceKeys = {};
      $('textScroll').innerHTML = ''; $('segCards').innerHTML = '';
      $('peopleCountVal').textContent = '--';
      $('peopleStatusAlert').textContent = '就绪';
      $('peopleStatusAlert').style.color = '#8899aa';
      $('gazeStatusNum').textContent = '待检测';
      $('gazeStatusNum').style.color = '#6b7a90';
      $('gazeStatusUnit').style.display = 'none';
      $('gazeProgressWrap').style.display = 'none';
      $('flowEventsBody').innerHTML = '';
      updateSummary();
      $('streamImg').src = ''; $('streamImg2').src = ''; $('streamImg3').src = '';
      audio.pause(); audio.removeAttribute('src'); audio.load(); lastClockSec = -1;
      connectSSE(function () {
        fetch('/start', { method: 'POST' })
          .then(r => r.json())
          .catch(function (err) {
            console.error('启动失败:', err);
            $('headerStatus').textContent = '❌ 启动失败';
            $('statusDot').className = '';
            $('startBtn').disabled = false; $('startBtn').textContent = '👤 开始测试';
          });
      });
    }

    function connectSSE(onReady) {
      if (dataSource) { dataSource.close(); dataSource = null }
      dataSource = new EventSource('/data');
      dataSource.onopen = function () {
        if (onReady) onReady();
      };
      dataSource.onmessage = function (e) { try { const d = JSON.parse(e.data); handleData(d); if (d.source === 'done') { dataSource.close(); dataSource = null } } catch (ex) { console.error('SSE处理异常:', ex); } };
      dataSource.onerror = function () {
        $('statusDot').className = '';
        $('headerStatus').textContent = '就绪';
        $('startBtn').disabled = false; $('startBtn').textContent = '👤 开始测试';
        setTimeout(function () {
          if (dataSource) return;
          fetch('/status').then(r => r.json()).then(function (d) {
            if (d.pipeline === 'idle') { $('progressGroup').style.display = 'none'; }
          }).catch(function () { });
        }, 3000);
      };
    }

    function updateSummary() {
      $('msSup').textContent = supN; $('msTicket').textContent = ticketN; $('msNotice').textContent = noticeN;
      if (segScores.length > 0) {
        const total = segScores.reduce((a, b) => a + b, 0);
        $('msTotal').textContent = total;
        $('msAvg').textContent = (total / segScores.length).toFixed(1);
      }
    }

    function dispatchItem(d) {
      const source = d.source;
      if (source === 'voice') addVoiceItem(d);
      else if (source === 'tracking') addDetData(d);
      // behavior 事件暂不在前端展示（举手/手指屏幕/手指文件由视频帧可视化）
      else if (source === 'gaze') addGazeData(d);
      else if (source === 'video') {
        if (d.data && d.data.frame_data) {
          $('streamImg').src = 'data:image/jpeg;base64,' + d.data.frame_data;
          $('overlay1').style.display = 'none';
          hasVisualizedFirstFrame = true;
        }
      }
      else if (source === 'behavior_screen_video') {
        if (d.data && d.data.frame_data) {
          $('streamImg2').src = 'data:image/jpeg;base64,' + d.data.frame_data;
          $('overlay2').style.display = 'none';
          hasVisualizedFirstFrame = true;
        }
      }
      else if (source === 'behavior_file_video') {
        if (d.data && d.data.frame_data) {
          $('streamImg3').src = 'data:image/jpeg;base64,' + d.data.frame_data;
          $('overlay3').style.display = 'none';
          hasVisualizedFirstFrame = true;
        }
      }
      else if (source === 'progress') updateProgress(d);
      else if (source === 'flow_start') addFlowEvent(d, true);
      else if (source === 'flow_end') addFlowEvent(d, false);
      else if (source === 'segment_report') addSegCard(d);
      else if (source === 'segment_report_stream') addSegStream(d);
      else if (source === 'video_start') {
        $('overlay1').style.display = 'none';
        $('overlay2').style.display = 'none';
        $('overlay3').style.display = 'none';
      }
      else if (source === 'done') {
        $('statusDot').className = ''; $('startBtn').disabled = false; $('startBtn').textContent = '🔄 重新测试';
        $('headerStatus').textContent = '✅ 完成'; $('progressGroup').style.display = 'none'; audio.pause();
      }
    }

    function handleData(d) {
      try {
        if (d.globalSec !== undefined) {
          lastClockSec = d.globalSec;

          // 窗口化音频对齐 (确保音频与 globalSec 推送的可视化结果在窗口内高度一致)
          syncAudioWindow(d.globalSec);
          if (hasVisualizedFirstFrame && audio.paused && d.globalSec > 0.1) {
            if (!audio.src || audio.src === location.href || audio.src.endsWith('/')) {
              audio.src = '/audio?t=' + Date.now(); audio.load(); audio.currentTime = d.globalSec;
            }
            audio.play().catch(function () { });
          }

          // 遍历并分发数据项
          for (var key in d) {
            if (key === 'globalSec') continue;
            var items = d[key];
            if (!Array.isArray(items)) continue;
            for (var i = 0; i < items.length; i++) {
              dispatchItem(Object.assign({ source: key }, items[i]));
            }
          }
          return;
        }
        dispatchItem(d);
      } catch (ex) { console.error('SSE处理异常:', ex); }
    }

    function updateProgress(d) {
      const moduleMap = { voice: "prVoice", tracker: "prMot", gaze: "prGaze" };
      $('progressGroup').style.display = '';
      const iconMap = { voice: '🎤', tracker: '🎯', gaze: '👁️' };
      const dt = d.data || {};
      const label = dt.label || d.label || '';
      const rid = moduleMap[label];
      if (!rid) { $('headerStatus').textContent = dt.detail || (dt.pct !== undefined ? dt.pct.toFixed(1) : '0.0') + '%'; return }
      const icon = iconMap[label] || '📊';
      const pct = Math.max(0, Math.min(100, dt.pct || 0)), bl = 20, f = Math.round(pct / 100 * bl);
      const bar = pct >= 100 ? '█'.repeat(bl) : '█'.repeat(f) + '░'.repeat(bl - f);
      const cls = pct >= 100 ? 'tqdm-done' : 'tqdm-bar';
      $(rid).innerHTML = `${icon} |<span class=${cls}>${bar}</span>| ${pct.toFixed(1)}%`;
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function renderWithHighlights(text, highlights) {
      if (!text) return '';
      if (!highlights || !highlights.length) return escapeHtml(text);
      let ranges = [];
      highlights.forEach(h => { if (!h) return; let idx = text.indexOf(h); while (idx !== -1) { ranges.push([idx, idx + h.length]); idx = text.indexOf(h, idx + 1); } });
      if (!ranges.length) return escapeHtml(text);
      ranges.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
      let out = '', last = 0;
      for (const r of ranges) { if (r[0] < last) continue; out += escapeHtml(text.slice(last, r[0])) + `<span class="kw-red">${escapeHtml(text.slice(r[0], r[1]))}</span>`; last = r[1]; }
      out += escapeHtml(text.slice(last));
      return out;
    }

    function _renderVoice(sec) {
      const el = $('voice-' + sec);
      if (!el) return;
      const txt = _voiceText[sec] || '';
      const keys = _voiceKeys[sec] || [];
      const textLine = txt ? `<div style="margin-top:1px;font-size:12px;line-height:1.4">${renderWithHighlights(txt, keys)}</div>` : '';
      el.innerHTML = `<span class="ts">[${fmt(sec)}]</span>${textLine}`;
    }

    function addVoiceItem(d) {
      const dt = d.data || {};
      const tag = d.tag || 'text';
      const sec = d.localSec;
      if (tag === 'key_moment') {
        const km = dt.key_moment;
        if (!km) return;
        if (!_voiceKeys[sec]) _voiceKeys[sec] = [];
        if (!_voiceKeys[sec].includes(km)) _voiceKeys[sec].push(km);
        _renderVoice(sec);
        return;
      }
      _voiceText[sec] = dt.text || '';
      if (!_voiceKeys[sec]) _voiceKeys[sec] = [];
      const el = document.createElement('div'); el.className = 'text-item'; el.id = 'voice-' + sec;
      $('textScroll').appendChild(el);
      _renderVoice(sec);
      el.scrollIntoView({ behavior: 'smooth' });
    }

    function addDetData(d) {
      const dt = d.data || {};
      const tagName = d.tag || '';
      if (tagName === 'PEOPLE_COUNT_UPDATE') {
        $('peopleCountVal').textContent = dt.count || '--';
        if (dt.state_alert) { $('peopleStatusAlert').textContent = '⚠️ ' + dt.state_alert; $('peopleStatusAlert').style.color = '#ff4d4d'; }
        else { $('peopleStatusAlert').textContent = '✅ 当前人数正常'; $('peopleStatusAlert').style.color = '#00ff88'; }
        return;
      }
    }

    function addGazeData(d) {
      const tagName = d.tag || '';
      const dt = d.data || {};
      if (tagName === 'gaze_status') {
        const numEl = $('gazeStatusNum'), unitEl = $('gazeStatusUnit'), wrapEl = $('gazeProgressWrap'), barEl = $('gazeProgressBar'), textEl = $('gazeProgressText');
        if (numEl && unitEl) {
          const heads = dt.heads_count || 0, inRoi = dt.any_in_roi, awayDur = dt.away_duration || 0;
          if (!dt.has_heads) { numEl.textContent = '无人'; unitEl.style.display = 'none'; numEl.style.color = '#6b7a90'; wrapEl.style.display = 'none'; }
          else if (inRoi) { numEl.textContent = heads; unitEl.textContent = '人注视盘台'; unitEl.style.display = ''; numEl.style.color = '#00ff88'; wrapEl.style.display = 'none'; }
          else {
            numEl.textContent = heads; unitEl.textContent = '人未看盘台'; unitEl.style.display = ''; numEl.style.color = '#ffaa00'; wrapEl.style.display = 'flex';
            const pct = Math.min(100, (awayDur / 60) * 100);
            barEl.style.width = pct.toFixed(0) + '%';
            if (awayDur >= 60) { barEl.style.background = '#ff4d4d'; textEl.style.color = '#ff4d4d'; textEl.textContent = '⚠️ ' + Math.round(awayDur) + '/60S 告警'; }
            else { barEl.style.background = '#ffaa00'; textEl.style.color = '#8899aa'; textEl.textContent = Math.round(awayDur) + '/60S'; }
          }
        }
        return;
      }
    }



    function addFlowEvent(d, isStart) {
      const dt = d.data || d;
      const map = { supervision: ['#00d4ff', '监护制'], info_notice: ['#00ffcc', '信息通报'] };
      const [color, name] = map[dt.flow_type] || ['#ffaa00', '自唱票'];
      const sec = isStart ? dt.flow_start_sec : dt.flow_end_sec;
      const el = document.createElement('div'); el.className = 'flow-event';
      el.style.borderLeftColor = color;
      el.innerHTML = `<span class="ts">[${fmt(sec)}]</span> <span style="color:${color}">${name}${isStart ? '开始' : '结束'}</span>`;
      $('flowEventsBody').appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toggleCard(card) {
      card.classList.toggle('collapsed');
      const arrow = card.querySelector('.sc-toggle-icon');
      if (arrow) { arrow.textContent = card.classList.contains('collapsed') ? '▶' : '▼'; }
    }

    function addSegCard(d) {
      const dt = d.data || d;
      const fid = dt.flow_id || dt.flowId;
      if (!fid) return;
      _completedFlows.add(fid);
      segScores.push(dt.score || 0);
      if (dt.flow_type === 'supervision') supN++; else if (dt.flow_type === 'info_notice') noticeN++; else ticketN++;
      updateSummary();
      const isNotice = dt.flow_type === 'info_notice';
      const isSup = dt.flow_type === 'supervision';
      const sc = dt.score >= 8 ? '#00ff88' : dt.score >= 5 ? '#ffaa00' : '#ff4d4d';
      const bc = isSup ? '#00d4ff' : (isNotice ? '#00ffcc' : '#ffaa00');
      const icon = isSup ? '🛡️' : (isNotice ? '📢' : '🎫');
      const label = isSup ? '监护制' : (isNotice ? '信息通报' : '自唱票');
      let card = $('card-' + fid);
      if (!card) { card = document.createElement('div'); card.id = 'card-' + fid; card.className = 'seg-card'; $('segCards').appendChild(card); }
      card.style.borderLeftColor = bc;
      card.innerHTML = `<div class="sc-head" onclick="toggleCard(this.parentNode)"><span>${icon} ${label} #${fid} [${dt.flow_continue_sec || '?'}s] <span class="sc-toggle-icon">▼</span></span><span class="sc-score" style="color:${sc}">${dt.score || 0}/10</span></div><div class="sc-bar"><div class="sc-bar-fill" style="width:${(dt.score || 0) * 10}%;background:${sc}"></div></div><div class="sc-detail" style="white-space:pre-wrap">${dt.report_text || ''}</div>`;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      const panel = $('segCards').parentNode;
      if (panel) { panel.scrollTop = panel.scrollHeight; }
    }

    let _streamBuffers = {};

    function addSegStream(d) {
      const dt = d.data || d;
      const fid = dt.flow_id || dt.flowId;
      if (!fid) return;
      if (_completedFlows.has(fid)) return;
      if (!_streamBuffers[fid]) { _streamBuffers[fid] = ''; }
      _streamBuffers[fid] += dt.chunk || '';
      let card = $('card-' + fid);
      if (!card) { card = document.createElement('div'); card.id = 'card-' + fid; card.className = 'seg-card'; card.style.borderLeftColor = '#6b7a90'; $('segCards').appendChild(card); }
      card.innerHTML = `<div class="sc-head" onclick="toggleCard(this.parentNode)"><span>🤖 大模型评估推理中… <span class="sc-toggle-icon">▼</span></span></div><div class="sc-detail" style="white-space:pre-wrap">${_streamBuffers[fid]}</div>`;
      const panel = $('segCards').parentNode;
      if (panel) { panel.scrollTop = panel.scrollHeight; }
    }
  </script>
</body>
</html>
